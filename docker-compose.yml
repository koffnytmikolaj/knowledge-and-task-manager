services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: carminero
      POSTGRES_PASSWORD: adminadmin
      POSTGRES_DB: knowledge_and_task_manager_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carminero -d knowledge_and_task_manager_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
